      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

<style title='marimo-custom'>/* Estilo de la presentación FICOTOX: océano #0F7A95, fondo claro, tipografía del sistema. */
:root {
  --fx-oceano: #0F7A95;
  --fx-oceano-osc: #0b4f61;
  --fx-oceano-claro: #e6f2f5;
  --fx-texto: #16272d;
  --fx-gris: #5b6b72;
  --fx-borde: #d7e3e7;
  --fx-fondo: #f7fafb;
  --fx-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fx-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
body, .markdown, .prose { font-family: var(--fx-sans); color: var(--fx-texto); }

/* Encabezado común */
.fx-head { display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 3px solid var(--fx-oceano); padding-bottom: 0.6rem; width: 100%; }
.fx-kicker { font-family: var(--fx-mono); font-size: 0.85rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--fx-oceano); margin-bottom: 0.2rem; }
.fx-title { font-size: 2.1rem; font-weight: 700; line-height: 1.15; margin: 0; color: var(--fx-texto);
  border: none; padding: 0; }
.fx-folio { font-family: var(--fx-mono); font-size: 0.95rem; color: var(--fx-gris); white-space: nowrap; }

/* Portada */
.fx-cover { display: flex; flex-direction: column; justify-content: center; min-height: 70vh;
  padding: 2rem 0 2rem 1.5rem; border-left: 10px solid var(--fx-oceano); }
.fx-cover-mark { font-family: var(--fx-mono); font-size: 1.1rem; letter-spacing: 0.35em; color: var(--fx-oceano); font-weight: 700; }
.fx-cover-title { font-size: 3.2rem; font-weight: 750; line-height: 1.1; margin: 0.6rem 0 1rem; color: var(--fx-texto); border: none; }
.fx-cover-sub { font-size: 1.5rem; color: var(--fx-oceano-osc); }
.fx-cover-foot { margin-top: 4rem; font-family: var(--fx-mono); font-size: 1rem; color: var(--fx-gris); letter-spacing: 0.1em; }

/* Listas */
.fx-list { margin: 0; padding-left: 1.3rem; font-size: 1.3rem; line-height: 1.5; }
.fx-list li { margin: 0.35rem 0; }
.fx-list li::marker { color: var(--fx-oceano); }
.fx-ol { margin: 0; padding-left: 2.4rem; font-size: 1.45rem; line-height: 1.45; }
.fx-ol li { margin: 0.8rem 0; padding-left: 0.4rem; }
.fx-ol li::marker { font-family: var(--fx-mono); color: var(--fx-oceano); font-weight: 700; }

/* Roles */
.fx-col { border-radius: 10px; padding: 0.8rem 1rem; border: 1px solid var(--fx-borde); background: #fff; height: 100%; }
.fx-col ul { margin: 0; padding-left: 1.1rem; font-size: 1.05rem; line-height: 1.4; }
.fx-col li { margin: 0.3rem 0; }
.fx-col-t { font-weight: 700; margin-bottom: 0.4rem; font-size: 1.1rem; }
.fx-si { border-top: 4px solid var(--fx-oceano); }
.fx-si .fx-col-t { color: var(--fx-oceano); }
.fx-no { border-top: 4px solid #b4533f; }
.fx-no .fx-col-t { color: #b4533f; }

/* Tarjetas */
.fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.fx-card { background: #fff; border: 1px solid var(--fx-borde); border-left: 5px solid var(--fx-oceano);
  border-radius: 10px; padding: 1rem 1.1rem; }
.fx-card-n { font-family: var(--fx-mono); color: var(--fx-oceano); font-size: 0.85rem; }
.fx-card-t { font-weight: 700; font-size: 1.2rem; margin: 0.25rem 0 0.35rem; }
.fx-card-d { color: var(--fx-gris); font-size: 1.05rem; line-height: 1.4; }

/* Paneles */
.fx-panel { background: #fff; border: 1px solid var(--fx-borde); border-top: 5px solid var(--fx-oceano);
  border-radius: 10px; padding: 1.1rem 1.3rem; height: 100%; }
.fx-panel-t { font-weight: 700; font-size: 1.35rem; margin-bottom: 0.6rem; color: var(--fx-oceano-osc); }

/* Flujo de informe */
.fx-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.35rem; }
.fx-step { background: var(--fx-oceano-claro); border: 1px solid var(--fx-oceano); color: var(--fx-oceano-osc);
  border-radius: 999px; padding: 0.3rem 0.8rem; font-weight: 600; font-size: 0.98rem; }
.fx-step:last-child { background: var(--fx-oceano); color: #fff; }
.fx-arrow { color: var(--fx-oceano); font-weight: 700; }

/* Ajustes del modo diapositivas: contenido alineado arriba y viñetas visibles. */
.mo-slide-content { margin: 34px 44px auto !important; width: calc(100% - 88px); }
.fx-list, .fx-col ul, .fx-panel ul { list-style: disc !important; }
.fx-ol { list-style: decimal !important; }
.fx-list li, .fx-col li, .fx-ol li { display: list-item; }
.fx-col, .fx-card, .fx-panel { font-family: var(--fx-sans) !important; }
.fx-col li { font-size: 1.12rem !important; line-height: 1.4 !important; margin: 0.25rem 0 !important; }

/* Lista compacta para la columna angosta junto a una captura */
.fx-list-sm { font-size: 1.15rem; line-height: 1.45; }
.fx-list-sm li { margin: 0.5rem 0; }

/* Cifras de la introducción */
.fx-cifras { display: grid; gap: 0.6rem; font-family: var(--fx-sans); }
.fx-cifras div { border-left: 4px solid var(--fx-oceano); padding: 0.2rem 0 0.2rem 0.8rem; }
.fx-cifras b { display: block; font-size: 1.2rem; color: var(--fx-oceano-osc); }
.fx-cifras span { font-size: 0.98rem; color: var(--fx-gris); }

/* Flujo vertical de una muestra */
.fx-flujo { list-style: none !important; counter-reset: paso; margin: 0; padding: 0; font-family: var(--fx-sans); }
.fx-flujo li { counter-increment: paso; position: relative; display: flex !important; align-items: center;
  gap: 0.7rem; padding: 0.24rem 0; font-size: 1.08rem; font-weight: 600; color: var(--fx-oceano-osc); }
.fx-flujo li::before { content: counter(paso); flex: 0 0 1.7rem; height: 1.7rem; border-radius: 999px;
  background: var(--fx-oceano-claro); border: 1px solid var(--fx-oceano); color: var(--fx-oceano-osc);
  font: 700 0.8rem/1.6rem var(--fx-mono); text-align: center; position: relative; z-index: 1; }
.fx-flujo li:not(:last-child)::after { content: ""; position: absolute; left: 0.85rem; top: 1.5rem; bottom: -0.55rem;
  width: 1px; background: var(--fx-oceano); }
.fx-nota { font-size: 1.05rem; line-height: 1.45; color: var(--fx-texto); margin: 1rem 0 0; }

/* Ficha de rol (Puede / No puede, apiladas) */
.fx-ficha { display: grid; gap: 0.7rem; font-family: var(--fx-sans); }
.fx-ficha .fx-col { height: auto; padding: 0.6rem 0.9rem; }
.fx-ficha .fx-col li { font-size: 1rem !important; line-height: 1.35 !important; margin: 0.15rem 0 !important; }
.fx-ficha .fx-col-t { font-size: 1rem; margin-bottom: 0.2rem; }
.fx-pend { background: #fdf6e7; border: 1px solid #ecd9a8; border-radius: 8px; padding: 0.5rem 0.8rem;
  font-size: 0.95rem; line-height: 1.35; color: #6b4e12; }

/* Caso de ejemplo (auditoría) */
.fx-caso { background: var(--fx-oceano-claro); border-left: 4px solid var(--fx-oceano); border-radius: 8px;
  padding: 0.7rem 0.9rem; font-size: 1.02rem; line-height: 1.45; font-family: var(--fx-sans); }

/* Capturas: ocupan su columna sin salirse de la diapositiva y conservan su proporción.
   --fx-ar = ancho/alto de la imagen; --fx-resta = alto reservado para encabezado, pie y márgenes. */
.fx-fig { margin: 0 0 0 auto; width: min(100%, calc((100vh - var(--fx-resta, 300px)) * var(--fx-ar, 1.6)));
  font-family: var(--fx-sans); }
.fx-fig img { display: block; width: 100%; height: auto; border: 1px solid var(--fx-borde); border-radius: 10px;
  box-shadow: 0 6px 22px rgba(15, 60, 75, 0.12); background: #fff; }
.fx-fig figcaption { margin-top: 0.45rem; font-size: 0.92rem; color: var(--fx-gris); text-align: right; }
.fx-fig figcaption span { color: var(--fx-oceano); }

/* Zoom sin JavaScript: <details> abierto = el <summary> cubre la pantalla con la imagen. */
.fx-zoom { display: block; margin: 0; }
.fx-zoom > summary { display: block; list-style: none; cursor: zoom-in; position: relative; outline: none; }
.fx-zoom > summary::-webkit-details-marker { display: none; }
.fx-zoom > summary::marker { content: ""; }
.fx-zoom > summary::after { content: "⤢"; position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px;
  border-radius: 8px; background: rgba(11, 79, 97, 0.85); color: #fff; font: 700 18px/30px var(--fx-sans);
  text-align: center; opacity: 0.8; }
.fx-zoom > summary:hover::after { opacity: 1; }
.fx-zoom[open] > summary { position: fixed; inset: 0; z-index: 10000; background: rgba(8, 24, 30, 0.92);
  display: flex; align-items: center; justify-content: center; padding: 1.5vh 1.5vw; cursor: zoom-out; }
.fx-zoom[open] > summary img { width: auto; height: auto; max-width: 100%; max-height: 100%; border: none;
  border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
.fx-zoom[open] > summary::after { content: "✕"; right: 18px; top: 18px; bottom: auto; }

r.\u003C/div\u003E\u003C/div\u003E\u003Cdiv class=\"fx-card\"\u003E\u003Cdiv class=\"fx-card-n\"\u003E06\u003C/div\u003E\u003Cdiv class=\"fx-card-t\"\u003ECuentas seguras\u003C/div\u003E\u003Cdiv class=\"fx-card-d\"\u003ECuentas temporales supervisadas, bloqueo por intentos y cierre de sesi\u00f3n por inactividad.\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "b717d5f6e679482d4cdc41eb389c7a16", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1.5rem'\u003E\u003Cdiv class=\"fx-head\"\u003E\u003Cdiv\u003E\u003Cdiv class=\"fx-kicker\"\u003EOperaci\u00f3n\u003C/div\u003E\u003Ch2 class=\"fx-title\"\u003EInformes de resultados\u003C/h2\u003E\u003C/div\u003E\u003Cdiv class=\"fx-folio\"\u003E06 / 09\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: flex-start;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cdiv style='flex: 1;display: flex;min-width: 0;min-height: 0'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1.2rem'\u003E\u003Cdiv class=\"fx-steps\"\u003E\u003Cspan class=\"fx-step\"\u003EBorrador\u003C/span\u003E\u003Cspan class=\"fx-arrow\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"fx-step\"\u003ERevisi\u00f3n\u003C/span\u003E\u003Cspan class=\"fx-arrow\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"fx-step\"\u003EAutorizado\u003C/span\u003E\u003Cspan class=\"fx-arrow\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"fx-step\"\u003ELiberado\u003C/span\u003E\u003Cspan class=\"fx-arrow\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"fx-step\"\u003EEnviado\u003C/span\u003E\u003C/div\u003E\u003Cul class=\"fx-list fx-list-sm\"\u003E\u003Cli\u003EAl \u003Cb\u003Eliberar\u003C/b\u003E se genera el PDF fina
